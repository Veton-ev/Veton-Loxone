# Gitleaks config for Veton repos — installed as <repo>/.gitleaks.toml by kit/apply.sh.
#
# Default rules (github-pat, aws, private keys, jwt, generic-api-key, ...) PLUS custom rules for the
# shapes actually seen in this estate. Allowlisting is BY PATH ONLY, for fixture directories and
# lockfiles. Never allowlist by phrase or regex on content: the wording that sits next to a real
# credential ("see 60-access", "never the value", "example") is exactly the wording that would
# silence the scanner (lesson from the handbook's first scanner, 2026-08-17).
#
# Test locally:  gitleaks git --pre-commit --staged --redact -c .gitleaks.toml
#                gitleaks dir . -c .gitleaks.toml --redact --no-banner
title = "veton-guardrail-kit"

[extend]
useDefault = true

# ---------------------------------------------------------------------------------------------
# Custom rules. Regex syntax is Go RE2 (no lookahead). `secretGroup` = capture group holding the
# secret. Values starting with `$`, `{` or `<` are excluded in the regex itself (they are
# variable references / templates, not values).
# ---------------------------------------------------------------------------------------------

[[rules]]
id = "veton-hmac-hex"
description = "HMAC / shared-secret style 32+ hex chars assigned to a secret-ish name"
regex = '''(?i)\b[a-z0-9_.-]*(hmac|secret|token|apikey|api_key|passwd|password|pass|pw)[a-z0-9_.-]*["']?\s*(=|:|=>|\?=|:=)\s*["']?([0-9a-f]{32,128})\b'''
secretGroup = 3
keywords = ["hmac", "secret", "token", "apikey", "api_key", "passwd", "password", "pass", "pw"]

[[rules]]
id = "veton-sshpass"
description = "sshpass -p <password> on the command line"
regex = '''sshpass\s+-p\s*["']?([^\s"'$`<*][^\s"']*)'''
secretGroup = 1
keywords = ["sshpass"]
# Placeholders are not secrets: <PASSWORD>, ***, $VAR, ${VAR}, `cmd`, 1-2 char values.
[rules.allowlist]
regexes = ['''^(<[^>]*>|\*+|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|.{1,2})$''']

[[rules]]
id = "veton-pass-assignment"
description = "PASS=value / *_PASS=value in shell, Makefile, .env (unquoted; same line; >=8 chars)"
# Unquoted values are only credible in shell/env style (`KEY=value`, no blanks around `=`) or with the
# Makefile-only operators `?=` / `:=`. `password = process.env.X` (blanks around `=`) is code, not a value.
# `[ \t]*` on purpose: `\s*` would cross a newline and pair a key with the next line's text.
regex = '''(?i)(^|[^a-z0-9_])(pass|[a-z0-9]*_pass|password|passwd|passphrase)(word|wd|phrase)?(=|[ \t]*(\?=|:=)[ \t]*)([^\s"'$<{`(\[][^\s"']{7,})'''
secretGroup = 6
keywords = ["pass", "password", "passwd", "passphrase"]
[[rules.allowlists]]
description = "obvious placeholders — checked against the VALUE only, never the surrounding prose"
regexTarget = "secret"
regexes = ['''(?i)^(changeme|change_me|example|placeholder|redacted|xxx+|your[-_].*|<[a-z_ -]+>|none|null|true|false|\*+|\.\.\.)$''']

[[rules]]
id = "veton-yaml-password"
description = "password: value in YAML / docker-compose / ini (unquoted allowed; same line; >=8 chars)"
# Restricted BY PATH to config formats: in .ts/.go/.py a bare `password: string` or `password: mqttPassword,` (scan-ok: non-value shape)
# is a type or a variable, never a value — those files are covered by veton-password-literal (quoted only).
path = '''(?i)\.(ya?ml|ini|cfg|conf|properties)$'''
regex = '''(?im)^[ \t]*-?[ \t]*["']?[a-z0-9_.-]*pass(word|wd|phrase)?["']?[ \t]*[:=][ \t]*["']?([^\s"'$<{#`][^\s"'#]{7,})'''
secretGroup = 2
keywords = ["password", "passwd", "passphrase", "pass:", "pass="]
[[rules.allowlists]]
description = "obvious placeholders — VALUE only"
regexTarget = "secret"
regexes = ['''(?i)^(changeme|change_me|example|placeholder|redacted|xxx+|your[-_].*|none|null|true|false|\*+|\.\.\.)$''']

[[rules]]
id = "veton-password-literal"
description = "password-named key assigned a QUOTED string literal (>=8 chars) on the same line, any language"
# The one shape that is a value in code: `password: "hunter2xyz"`, `pw = 'x'`, `PASSWORD => "y"`, `password="z"`.
regex = '''(?i)\b[a-z0-9_.-]*pass(word|wd|phrase)?["']?[ \t]*(=>|:=|\?=|=|:)[ \t]*["']([^\s"'$<{`][^"'\n]{7,})["']'''
secretGroup = 3
keywords = ["pass", "password", "passwd", "passphrase"]
[[rules.allowlists]]
description = "obvious placeholders — VALUE only"
regexTarget = "secret"
regexes = ['''(?i)^(changeme|change_me|example|placeholder|redacted|xxx+|your[-_].*|<[a-z_ -]+>|none|null|true|false|\*+|\.\.\.)$''']

[[rules]]
id = "veton-next-line-literal"
description = "defaultValue: / default: / password-named key with the string literal on the NEXT line (dart-format wrap)"
# `String.fromEnvironment('K', defaultValue:\n 'value')` after `dart format` wraps the line; so does
# `static const String xPassword =\n 'value'`. Per-line scanners miss it. `defaultValue:` also matches on the
# same line (a Flutter-only key; 0 non-credential uses in the app repo); `default:` and `*password` need
# the newline (JS `default: 'production'` and same-line passwords belong to other rules).
regex = '''(?i)(\bdefaultValue[ \t]*:[ \t]*(\r?\n[ \t]*)?|\b(default|[a-z0-9_.-]*pass(word|wd|phrase)?)[ \t]*[:=][ \t]*\r?\n[ \t]*)["']([^\s"'$<{`][^"'\n]{7,})["']'''
secretGroup = 5
keywords = ["defaultvalue", "default", "pass", "password", "passwd", "passphrase"]
[[rules.allowlists]]
description = "obvious placeholders — VALUE only"
regexTarget = "secret"
regexes = ['''(?i)^(changeme|change_me|example|placeholder|redacted|xxx+|your[-_].*|<[a-z_ -]+>|none|null|true|false|\*+|\.\.\.|https?://[^@]*)$''']

[[rules]]
id = "veton-url-inline-credentials"
description = "postgres://user:pass@ and other connection URLs with an inline password"
# Password of >=1 char on purpose (`postgres://u:p@h` is a real leak shape); placeholders are excluded by value.
regex = '''(?i)\b(postgres(ql)?|mysql|mariadb|mongodb(\+srv)?|redis|rediss|amqps?|mqtts?|ftp|sftp|https?)://[^\s:/@"']+:([^\s@"'$<{`][^\s@"']*)@'''
secretGroup = 4
keywords = ["://"]
[[rules.allowlists]]
description = "obvious placeholders — VALUE only"
regexTarget = "secret"
regexes = ['''(?i)^(pass(word)?|changeme|example|placeholder|redacted|xxx+|secret|your[-_].*)$''']

[[rules]]
id = "veton-cloudflare-tunnel-token"
description = "Cloudflare tunnel token (long base64 starting eyJ, no dots — not a JWT)"
regex = '''\beyJ[A-Za-z0-9+/=_-]{120,}\b'''
keywords = ["eyJ"]

[[rules]]
id = "veton-github-token"
description = "GitHub token (ghp_/gho_/ghu_/ghs_/ghr_/github_pat_)"
regex = '''\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{40,}\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]

[[rules]]
id = "veton-anthropic-key"
description = "Anthropic API / admin key"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "veton-private-key-block"
description = "PEM private key block (belt and braces beside the default rule)"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY( BLOCK)?-----'''
keywords = ["PRIVATE KEY"]

# ---------------------------------------------------------------------------------------------
# Loxone project files (*.Loxone, *.LoxCC, MB_*.xml). Every rule above keys on a word like
# `password`/`token` or a vendor prefix — a Loxone file has neither. The tell is the XML
# ATTRIBUTE NAME; the value is undecorated hex/base64/plain text. Each rule therefore fires on
# the attribute name and requires a NON-EMPTY value: the shipped project ships these cleared
# (`H=""`, `Serial=""`, `APPKEY=""`, `Address=""`), so "empty" is the safe state and any value
# is a re-export taken from a real Miniserver.
# ---------------------------------------------------------------------------------------------

[[rules]]
id = "loxone-user-password-verifier"
description = "Loxone <HP H=...> user password verifier (hex)"
regex = '''<HP[^>]*\sH="([0-9a-fA-F]{16,})"'''
secretGroup = 1
keywords = ["<hp"]

[[rules]]
id = "loxone-user-password-salt"
description = "Loxone <HP S=...> password salt (hex/base64). The \\bS=\" anchor does not match Sc=\""
regex = '''<HP[^>]*\sS="([A-Za-z0-9+/=_-]{8,})"'''
secretGroup = 1
keywords = ["<hp"]

[[rules]]
id = "loxone-miniserver-serial"
description = "Loxone Miniserver serial (its MAC) / installation serial - identifies a customer site"
regex = '''\bSerial="([0-9A-Fa-f]{6,})"'''
secretGroup = 1
keywords = ["serial="]

[[rules]]
id = "loxone-appkey"
description = "Loxone document APPKEY / APPID carrying a value (the shipped file must have it empty)"
regex = '''\bAPP(?:KEY|ID)=["']?([^\s"'<>${}][^\s"'<>]*)'''
secretGroup = 1
keywords = ["appkey", "appid"]

[[rules]]
id = "loxone-server-address"
description = "Filled-in Address= on a Modbus/Mqtt/Virtual server element (a customer charger or broker IP)"
# Scoped to the server element through Type=, so the shipped Weather Server URL
# (Type="WeatherServer") and the Logger file path (Type="Logger") do not fire.
regex = '''Type="(?:Modbus|Mqtt|MQTT|Virtual)[A-Za-z0-9]*Server"[^>]*\sAddress="([^"\s]+)"'''
secretGroup = 1
keywords = ["modbus", "mqtt", "virtual"]

[[rules]]
id = "loxone-site-postal-address"
description = "Loxone project location: Street / Town / PostCode with a value (customer site)"
regex = '''\b(?:Street|Town|PostCode)="([^"]+)"'''
secretGroup = 1
keywords = ["street=", "town=", "postcode="]

[[rules]]
id = "loxone-site-coordinates"
description = "Loxone project Latitude / Longitude set to a non-zero value (pinpoints a customer site)"
# The shipped project carries "0"; the regex needs at least one non-zero digit, so 0 / 0.0 pass.
regex = '''\b(?:Latitude|Longitude)="(-?[0-9.]*[1-9][0-9.]*)"'''
secretGroup = 1
keywords = ["latitude", "longitude"]

[[rules]]
id = "loxone-user-pii"
description = "Loxone user record PII: Ema (e-mail), Phn (phone), FiN / LaN (first / last name)"
regex = '''\b(?:Ema|Phn|FiN|LaN)="([^"]+)"'''
secretGroup = 1
keywords = ["ema=", "phn=", "fin=", "lan="]

[[rules]]
id = "loxone-access-tokens"
description = "Loxone access-credential arrays: iButton / access code / NFC tag ids"
regex = '''\b(?:iBtnArr|CodeArr|NFCArr|NFCNArr|EAIdArr)="([^"]+)"'''
secretGroup = 1
keywords = ["ibtnarr", "codearr", "nfcarr", "nfcnarr", "eaidarr"]

# ---------------------------------------------------------------------------------------------
# Global allowlist — PATHS ONLY. No content regexes, no stopwords.
# ---------------------------------------------------------------------------------------------
[[allowlists]]
description = "known fixture directories and lockfiles (by path only)"
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)kit/gitleaks\.toml$''',
  '''(^|/)testdata/''',
  '''(^|/)__fixtures__/''',
  '''(^|/)fixtures/''',
  '''(^|/)test/fixtures/''',
  '''(^|/)tests/fixtures/''',
  '''(^|/)go\.sum$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)pubspec\.lock$''',
  '''(^|/)poetry\.lock$''',
  '''(^|/)Cargo\.lock$''',
]
